<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NÚCLEO essences — Control Total</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Jost:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --black:#0a0908; --panel:#131110; --panel-2:#1a1512; --oxblood:#3a0e10; --oxblood-2:#57181a;
  --gold:#b8905e; --gold-2:#d9bd8e; --cream:#efe6da; --muted:#a89a8c; --line:rgba(184,144,94,0.2);
  --ok:#8fce9b; --warn:#e0b48a; --err:#e08a8a; --shadow:0 16px 40px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--black);color:var(--cream);font-family:'Jost',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;}
.serif{font-family:'Playfair Display',serif;}
.mono{font-family:'JetBrains Mono',monospace;}
::selection{background:var(--oxblood-2);color:var(--gold-2);}

/* ---- shell ---- */
.shell{display:flex;min-height:100vh;}
.side{width:220px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:26px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.side .brand{padding:0 22px 22px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.side .brand .word{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:700;letter-spacing:0.06em;}
.side .brand .word em{display:block;font-style:italic;font-weight:400;font-size:0.6rem;letter-spacing:0.28em;color:var(--gold);margin-top:2px;}
.side .brand .sub{font-size:0.66rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-top:10px;}
.navitem{display:flex;align-items:center;gap:10px;padding:12px 22px;font-size:0.86rem;color:var(--muted);cursor:pointer;border-left:3px solid transparent;transition:all .18s ease;}
.navitem:hover{color:var(--cream);background:rgba(184,144,94,0.06);}
.navitem.active{color:var(--gold-2);border-left-color:var(--gold);background:rgba(184,144,94,0.08);}
.navitem .ic{width:16px;text-align:center;opacity:0.8;}

.main{flex:1;padding:30px 34px 80px;max-width:1360px;}
.pagehead{margin-bottom:26px;}
.pagehead h1{font-size:1.7rem;margin:0 0 4px;font-weight:600;}
.pagehead p{color:var(--muted);margin:0;font-size:0.86rem;}

/* ---- cards / kpis ---- */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
.kpi{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
.kpi .l{font-size:0.66rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.kpi .n{font-family:'Playfair Display',serif;font-size:1.5rem;color:var(--gold-2);}
.kpi .n.ok{color:var(--ok);} .kpi .n.warn{color:var(--warn);} .kpi .n.err{color:var(--err);}

.panel{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:22px;}
.panel h3{font-family:'Playfair Display',serif;font-size:1.05rem;margin:0 0 14px;color:var(--gold-2);font-weight:600;}

/* ---- pedido ribbon (signature element on Resumen) ---- */
.ribbon-wrap{overflow-x:auto;padding-bottom:6px;margin-bottom:26px;}
.ribbon{display:flex;gap:6px;min-width:max-content;}
.rb-item{flex:none;width:34px;height:54px;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:0.62rem;color:var(--muted);border:1px solid var(--line);cursor:default;position:relative;}
.rb-item .num{font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--cream);font-size:0.68rem;}
.rb-item .bar{width:60%;background:var(--gold);border-radius:2px;margin-top:3px;}
.rb-item:hover{border-color:var(--gold);}
.rb-item .tip{display:none;position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:var(--black);border:1px solid var(--gold);padding:6px 9px;border-radius:5px;font-size:0.68rem;white-space:nowrap;z-index:5;color:var(--cream);}
.rb-item:hover .tip{display:block;}

/* ---- filter bar ---- */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filterbar input[type=text], .filterbar select{background:var(--black);border:1px solid var(--line);color:var(--cream);padding:8px 12px;border-radius:6px;font-family:'Jost',sans-serif;font-size:0.82rem;}
.chip{font-size:0.72rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);cursor:pointer;background:var(--panel);}
.chip.sel{background:var(--gold);color:var(--black);border-color:var(--gold);}
.btn{font-family:'Jost',sans-serif;font-size:0.78rem;font-weight:500;letter-spacing:0.03em;padding:9px 16px;border-radius:6px;border:1px solid var(--gold);background:var(--gold);color:var(--black);cursor:pointer;transition:opacity .2s;}
.btn:hover{opacity:0.88;}
.btn.ghost{background:transparent;color:var(--gold-2);}
.btn.danger{background:transparent;border-color:#5a2c2c;color:var(--err);}
.btn.sm{padding:5px 10px;font-size:0.7rem;}

/* ---- table ---- */
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
table{width:100%;border-collapse:collapse;font-size:0.82rem;min-width:800px;}
th{text-align:left;font-size:0.65rem;letter-spacing:0.07em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel);white-space:nowrap;position:sticky;top:0;}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:hover td{background:rgba(184,144,94,0.04);}
.badge{display:inline-block;font-size:0.63rem;letter-spacing:0.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;}
.badge.ok{color:var(--ok);border-color:#2f5a37;}
.badge.warn{color:var(--warn);border-color:#5a4128;}
.badge.err{color:var(--err);border-color:#5a2c2c;}
.badge.muted{color:var(--muted);}
.editable{cursor:pointer;border-bottom:1px dashed var(--line);}
.editable:hover{border-bottom-color:var(--gold);}
input.cellinput{background:var(--black);border:1px solid var(--gold);color:var(--cream);padding:4px 6px;border-radius:4px;font-family:'Jost',sans-serif;font-size:0.8rem;width:90px;}

/* ---- modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(6,5,4,0.85);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-bg.open{display:flex;}
.modal{width:100%;max-width:460px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:24px;max-height:88vh;overflow-y:auto;}
.modal h3{font-family:'Playfair Display',serif;margin:0 0 16px;color:var(--gold-2);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:0.7rem;color:var(--muted);margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;background:var(--black);border:1px solid var(--line);color:var(--cream);border-radius:5px;font-family:'Jost',sans-serif;font-size:0.85rem;}
.field textarea{resize:vertical;min-height:50px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn{flex:1;}
.checkrow{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
.checkrow label{display:flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--muted);}

.empty{padding:36px;text-align:center;color:var(--muted);font-size:0.86rem;}
.foot-total{font-weight:600;color:var(--gold-2);}
.small{font-size:0.72rem;color:var(--muted);}
.right{text-align:right;}
.center{text-align:center;}

@media (max-width:820px){
  .shell{flex-direction:column;}
  .side{width:100%;height:auto;position:relative;display:flex;overflow-x:auto;padding:12px 0;}
  .side .brand{display:none;}
  .navitem{border-left:none;border-bottom:3px solid transparent;padding:10px 16px;white-space:nowrap;}
  .navitem.active{border-left:none;border-bottom-color:var(--gold);}
  .main{padding:20px 16px 60px;}
}

/* ---- gate de contraseña (mismo patrón que /admin.html) ---- */
#gate{max-width:360px;margin:14vh auto;text-align:center;padding:0 20px;}
#gate h1{font-family:'Playfair Display',serif;font-size:1.6rem;margin:0 0 8px;}
#gate p{color:var(--muted);font-size:0.9rem;margin:0 0 24px;}
#gate input{width:100%;padding:13px 16px;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--cream);font-family:'Jost',sans-serif;font-size:0.95rem;margin-bottom:12px;}
#gate input:focus{outline:none;border-color:var(--gold);}
#gate button{width:100%;padding:13px;background:var(--gold);color:var(--black);border:none;border-radius:6px;font-family:'Jost',sans-serif;font-weight:600;font-size:0.85rem;letter-spacing:0.05em;cursor:pointer;}
#gate button:disabled{opacity:0.6;cursor:default;}
#gate .err{color:#e08a8a;font-size:0.82rem;margin-top:10px;min-height:16px;}
</style>
</head>
<body>

<!-- ============ GATE DE CONTRASEÑA ============ -->
<div id="gate">
  <h1 class="serif">Control Total</h1>
  <p>Acceso privado — NÚCLEO essences</p>
  <input type="password" id="gatePassword" placeholder="Contraseña">
  <button id="gateBtn">Entrar</button>
  <div class="err" id="gateErr"></div>
</div>

<div class="shell" id="appShell" style="display:none;">
  <nav class="side" id="sideNav">
    <div class="brand">
      <div class="word">NÚCLEO<em>essences</em></div>
      <div class="sub">Control Total</div>
    </div>
    <div class="navitem active" data-tab="resumen"><span class="ic">◆</span> Resumen</div>
    <div class="navitem" data-tab="ventas"><span class="ic">◆</span> Ventas / Pedidos</div>
    <div class="navitem" data-tab="clientes"><span class="ic">◆</span> Clientes</div>
    <div class="navitem" data-tab="gastos"><span class="ic">◆</span> Gastos</div>
    <div class="navitem" data-tab="difusores"><span class="ic">◆</span> Difusores &amp; Rentas</div>
    <div class="navitem" data-tab="flujo"><span class="ic">◆</span> Flujo de Caja</div>
  </nav>

  <div class="main">
    <div id="loadingMsg" class="empty">Cargando...</div>
    <div id="pageContent" style="display:none;"></div>
  </div>
</div>

<!-- ============ MODAL: nueva/editar venta ============ -->
<div class="modal-bg" id="modalVenta">
  <div class="modal">
    <h3 id="mvTitle">Nueva venta</h3>
    <div class="field"><label>Pedido (número o referencia)</label><input type="text" id="mvPedido" placeholder="Ej. 33"></div>
    <div class="field"><label>Cliente</label><input type="text" id="mvCliente" placeholder="Nombre del cliente"></div>
    <div class="field"><label>Producto</label><input type="text" id="mvProducto" placeholder="Ej. Santal 33 (30 ml)"></div>
    <div class="field"><label>Categoría</label>
      <select id="mvCategoria">
        <option>Perfume/Decant</option>
        <option>Aceite ambiental</option>
        <option>Difusor (equipo)</option>
        <option>Tester</option>
        <option>Otro</option>
      </select>
    </div>
    <div class="field"><label>Costo (MXN)</label><input type="number" id="mvCosto" placeholder="0"></div>
    <div class="field"><label>Venta / precio cobrado (MXN)</label><input type="number" id="mvVenta" placeholder="0"></div>
    <button type="button" class="btn ghost sm" id="mvSugerir" style="margin-bottom:12px;">✨ Sugerir precio según el producto</button>
    <div class="small" id="mvSugerirMsg" style="margin:-6px 0 12px;"></div>
    <div class="checkrow">
      <label><input type="checkbox" id="mvPagado"> Pagado</label>
      <label><input type="checkbox" id="mvEntregado"> Entregado</label>
      <label><input type="checkbox" id="mvRegalo"> Regalo</label>
      <label><input type="checkbox" id="mvStock"> Stock (no es venta a cliente)</label>
      <label><input type="checkbox" id="mvDomicilio"> Envío a domicilio</label>
    </div>
    <div class="field"><label>Notas</label><textarea id="mvNotas"></textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('modalVenta')">Cancelar</button>
      <button class="btn" id="mvGuardar">Guardar</button>
    </div>
  </div>
</div>

<!-- ============ MODAL: nuevo/editar gasto ============ -->
<div class="modal-bg" id="modalGasto">
  <div class="modal">
    <h3 id="mgTitle">Nuevo gasto</h3>
    <div class="field"><label>Pedido / referencia (opcional)</label><input type="text" id="mgPedido"></div>
    <div class="field"><label>Concepto</label><input type="text" id="mgConcepto" placeholder="Ej. Etiquetas y diseño"></div>
    <div class="field"><label>Monto (MXN)</label><input type="number" id="mgMonto" placeholder="0"></div>
    <div class="field"><label>Fecha (opcional)</label><input type="date" id="mgFecha"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('modalGasto')">Cancelar</button>
      <button class="btn" id="mgGuardar">Guardar</button>
    </div>
  </div>
</div>

<!-- ============ MODAL: difusor (venta/renta) ============ -->
<div class="modal-bg" id="modalDifusor">
  <div class="modal">
    <h3 id="mdTitle">Nuevo registro de difusor</h3>
    <div class="field"><label>Tipo</label>
      <select id="mdTipo"><option value="venta">Venta</option><option value="renta">Renta mensual</option></select>
    </div>
    <div class="field"><label>Cliente</label><input type="text" id="mdCliente"></div>
    <div class="field"><label>Modelo / paquete</label><input type="text" id="mdModelo" placeholder="Ej. A60 / Paquete Aura"></div>
    <div class="field"><label>Monto (MXN)</label><input type="number" id="mdMonto"></div>
    <div class="field"><label>Fecha</label><input type="date" id="mdFecha"></div>
    <div class="checkrow">
      <label><input type="checkbox" id="mdPagado"> Pagado</label>
      <label><input type="checkbox" id="mdActivo" checked> Activo (si es renta)</label>
    </div>
    <div class="field"><label>Notas</label><textarea id="mdNotas"></textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('modalDifusor')">Cancelar</button>
      <button class="btn" id="mdGuardar">Guardar</button>
    </div>
  </div>
</div>

<div class="empty" id="toast" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--gold);border-radius:999px;padding:10px 20px;z-index:300;color:var(--cream);font-size:0.82rem;"></div>

<script>
/* ============================================================
   NÚCLEO essences — Control Total
   App de control interno: ventas/pedidos, clientes, gastos,
   difusores/rentas y flujo de caja. Datos guardados en
   Vercel KV a través de /api/control-total (privado, protegido con
   contraseña).
   ============================================================ */

const STORAGE_KEYS = { data: 'nucleo-data' };

let VENTAS = [];
let GASTOS = [];
let DIFUSORES = [];
let currentTab = 'resumen';
let editingId = null; // id del registro que se está editando en un modal (null = nuevo)

const money = (n) => (n === null || n === undefined || isNaN(n)) ? '—' : '$' + Number(n).toLocaleString('es-MX', { maximumFractionDigits: 0 }) + ' MXN';
const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* ---------------- Precios estándar (confirmados por el usuario) ----------------
   Perfume 30/60/100 ml, spray ambiental 250 ml, aceite para difusor 250/500 ml/1L.
   Los difusores (equipo) NO tienen precio fijo — varían por envío/tipo de cambio,
   esos siempre se capturan a mano. */
function sugerirPrecio(producto) {
  if (!producto) return null;
  const low = producto.toLowerCase();
  const mCant = producto.match(/^\s*(\d+)\s+(.*)/);
  const cantidad = mCant ? parseInt(mCant[1], 10) : 1;
  const esSpray = /spray/.test(low);

  if (/250\s*ml/.test(low)) {
    return esSpray
      ? { costo: 400 * cantidad, venta: 600 * cantidad, cantidad, label: 'Spray ambiental 250 ml' }
      : { costo: 400 * cantidad, venta: 900 * cantidad, cantidad, label: 'Aceite difusor 250 ml' };
  }
  if (/500\s*ml/.test(low)) return { costo: 800 * cantidad, venta: 1300 * cantidad, cantidad, label: 'Aceite difusor 500 ml' };
  if (/\b1\s*(litro|lt|l)\b/.test(low)) return { costo: 1500 * cantidad, venta: 2000 * cantidad, cantidad, label: 'Aceite difusor 1 litro' };
  if (/100\s*ml/.test(low)) return { costo: 300 * cantidad, venta: 600 * cantidad, cantidad, label: 'Perfume 100 ml' };
  if (/60\s*ml/.test(low)) return { costo: 185 * cantidad, venta: 390 * cantidad, cantidad, label: 'Perfume 60 ml' };
  if (/30\s*ml/.test(low)) return { costo: 135 * cantidad, venta: 280 * cantidad, cantidad, label: 'Perfume 30 ml' };
  return null;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.style.display = 'none'; }, 2200);
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  editingId = null;
}
function openModalEl(id) {
  document.getElementById(id).classList.add('open');
}

/* ---------------- Storage ----------------
   Todo (ventas, gastos, difusores) se guarda como un solo objeto en
   Vercel KV a través de /api/control-total, protegido con la misma
   contraseña que el Panel (ADMIN_PASSWORD). */
function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

async function apiControlTotal(action, data) {
  const resp = await fetch('/api/control-total', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: GATE_PASSWORD, action, data }),
  });
  const body = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(body.error || 'Error de conexión.');
  return body;
}

async function loadAll() {
  let parsed = null;
  let lastError = null;
  const maxAttempts = 3;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const r = await apiControlTotal('get');
      parsed = r.data || null;
      lastError = null;
      break; // éxito (incluso si r.data es null, es decir "aún no hay datos guardados")
    } catch (e) {
      lastError = e;
      if (attempt < maxAttempts) await sleep(400 * attempt);
    }
  }
  if (lastError) {
    console.error('Error leyendo datos tras ' + maxAttempts + ' intentos', lastError);
    showToast('No se pudo cargar tus datos guardados — reintenta recargando la página.');
  }

  VENTAS = (parsed && parsed.ventas) ? parsed.ventas : null;
  GASTOS = (parsed && parsed.gastos) ? parsed.gastos : null;
  DIFUSORES = (parsed && parsed.difusores) ? parsed.difusores : null;

  let needsSeed = false;
  if (VENTAS === null) { VENTAS = SEED_VENTAS.slice(); needsSeed = true; }
  if (GASTOS === null) { GASTOS = SEED_GASTOS.slice(); needsSeed = true; }
  if (DIFUSORES === null) { DIFUSORES = []; needsSeed = true; }

  if (needsSeed) await persist();
}

/* La API a veces puede fallar por un hipo transitorio de red.
   Reintentamos automáticamente con espera creciente antes de avisar
   al usuario que algo realmente falló. */
async function persist(retries = 4) {
  const payload = { ventas: VENTAS, gastos: GASTOS, difusores: DIFUSORES };
  let lastError = null;
  for (let attempt = 1; attempt <= retries; attempt++) {
    try {
      const result = await apiControlTotal('save', payload);
      if (result && result.ok) return true; // éxito
      lastError = new Error('Guardado devolvió una respuesta inesperada');
    } catch (e) {
      lastError = e;
    }
    if (attempt < retries) await sleep(400 * attempt); // 400ms, 800ms, 1200ms...
  }
  console.error('Error guardando datos tras ' + retries + ' intentos', lastError);
  showToast('No se pudo guardar tras varios intentos — revisa tu conexión e intenta de nuevo.');
  return false;
}

function nextId(prefix, arr) {
  let max = 0;
  arr.forEach((x) => {
    const m = String(x.id || '').match(/(\d+)$/);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return prefix + (max + 1);
}

/* ---------------- Nav ---------------- */
document.querySelectorAll('.navitem').forEach((el) => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.navitem').forEach((n) => n.classList.remove('active'));
    el.classList.add('active');
    currentTab = el.dataset.tab;
    render();
  });
});

function render() {
  const c = document.getElementById('pageContent');
  if (currentTab === 'resumen') c.innerHTML = renderResumen();
  else if (currentTab === 'ventas') c.innerHTML = renderVentas();
  else if (currentTab === 'clientes') c.innerHTML = renderClientes();
  else if (currentTab === 'gastos') c.innerHTML = renderGastos();
  else if (currentTab === 'difusores') c.innerHTML = renderDifusores();
  else if (currentTab === 'flujo') c.innerHTML = renderFlujo();
  attachHandlers();
}

/* ============ RESUMEN ============ */
function renderResumen() {
  const ventasConMonto = VENTAS.filter((v) => v.montoConocido && !v.stock);
  const totalVenta = ventasConMonto.reduce((s, v) => s + (v.venta || 0), 0);
  const totalCosto = ventasConMonto.reduce((s, v) => s + (v.costo || 0), 0);
  const totalUtilidad = ventasConMonto.reduce((s, v) => s + ((v.venta || 0) - (v.costo || 0)), 0);
  const totalGastos = GASTOS.reduce((s, g) => s + (Number(g.monto) || 0), 0);
  const flujoNeto = totalVenta - totalGastos;
  const pendientesPago = VENTAS.filter((v) => !v.pagado && !v.regalo && !v.stock).length;
  const sinMonto = VENTAS.filter((v) => !v.montoConocido && !v.stock).length;
  const regalos = VENTAS.filter((v) => v.regalo).length;

  const rentaActivas = DIFUSORES.filter((d) => d.tipo === 'renta' && d.activo).length;
  const ventasDifusores = DIFUSORES.filter((d) => d.tipo === 'venta').reduce((s, d) => s + (Number(d.monto) || 0), 0);

  // top clientes por # de artículos (excluyendo stock/venta general)
  const porCliente = {};
  VENTAS.forEach((v) => {
    if (v.stock || v.cliente === 'Venta general (mostrador)') return;
    const key = v.cliente.trim().toLowerCase();
    if (!porCliente[key]) porCliente[key] = { nombre: v.cliente.trim(), items: 0, gasto: 0 };
    porCliente[key].items++;
    if (v.montoConocido) porCliente[key].gasto += (v.venta || 0);
  });
  const topClientes = Object.values(porCliente).sort((a, b) => b.items - a.items).slice(0, 8);

  // pedidos ribbon: agrupar por pedido, contar items
  const porPedido = {};
  VENTAS.forEach((v) => {
    const p = v.pedido || '?';
    if (!porPedido[p]) porPedido[p] = 0;
    porPedido[p]++;
  });
  const pedidosOrdenados = Object.keys(porPedido).sort((a, b) => {
    const na = parseInt(a, 10), nb = parseInt(b, 10);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a).localeCompare(String(b));
  });
  const maxCount = Math.max(...Object.values(porPedido), 1);

  const ribbonHtml = pedidosOrdenados.map((p) => {
    const count = porPedido[p];
    const h = Math.max(6, Math.round((count / maxCount) * 30));
    return `<div class="rb-item"><span class="tip">Pedido ${esc(p)} — ${count} artículos</span><div class="num">${esc(p)}</div><div class="bar" style="height:${h}px;"></div></div>`;
  }).join('');

  return `
    <div class="pagehead">
      <h1 class="serif">Resumen general</h1>
      <p>Vista global de ventas, gastos y utilidad de NÚCLEO essences.</p>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="l">Ventas totales</div><div class="n">${money(totalVenta)}</div></div>
      <div class="kpi"><div class="l">Costo total</div><div class="n">${money(totalCosto)}</div></div>
      <div class="kpi"><div class="l">Utilidad bruta</div><div class="n ok">${money(totalUtilidad)}</div></div>
      <div class="kpi"><div class="l">Gastos operativos</div><div class="n warn">${money(totalGastos)}</div></div>
      <div class="kpi"><div class="l">Flujo neto</div><div class="n ${flujoNeto >= 0 ? 'ok' : 'err'}">${money(flujoNeto)}</div></div>
      <div class="kpi"><div class="l">Pendientes de pago</div><div class="n ${pendientesPago ? 'warn' : ''}">${pendientesPago}</div></div>
      <div class="kpi"><div class="l">Sin monto capturado</div><div class="n ${sinMonto ? 'warn' : ''}">${sinMonto}</div></div>
      <div class="kpi"><div class="l">Regalos entregados</div><div class="n">${regalos}</div></div>
      <div class="kpi"><div class="l">Rentas de difusor activas</div><div class="n">${rentaActivas}</div></div>
      <div class="kpi"><div class="l">Ventas de difusores</div><div class="n">${money(ventasDifusores)}</div></div>
    </div>

    <div class="panel">
      <h3>Historial de pedidos (${pedidosOrdenados.length})</h3>
      <p class="small" style="margin:-6px 0 14px;">Cada barra es un "Pedido" — su altura muestra cuántos artículos incluyó. Pasa el cursor para ver el detalle.</p>
      <div class="ribbon-wrap"><div class="ribbon">${ribbonHtml}</div></div>
    </div>

    <div class="panel">
      <h3>Clientes más frecuentes</h3>
      <div class="twrap"><table>
        <thead><tr><th>Cliente</th><th class="right">Artículos comprados</th><th class="right">Total gastado (conocido)</th></tr></thead>
        <tbody>
          ${topClientes.map((c) => `<tr><td>${esc(c.nombre)}</td><td class="right">${c.items}</td><td class="right">${money(c.gasto)}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">Sin datos aún.</td></tr>'}
        </tbody>
      </table></div>
    </div>

    ${sinMonto > 0 ? `
    <div class="panel" style="border-color:#5a4128;">
      <h3 style="color:var(--warn);">⚠ ${sinMonto} ventas sin monto capturado</h3>
      <p class="small" style="margin:0 0 8px;">Ya completé automáticamente los aceites/spray ambiental (250 ml, 500 ml, 1 litro) y los perfumes de línea propia (30/60/100 ml) con tus precios estándar. Lo que queda sin monto son los <strong>decants de marcas de diseñador</strong> de los pedidos de WhatsApp — esos no traían tamaño ni precio en las notas originales, así que no puedo inventarlos.</p>
      <p class="small" style="margin:0;">Ve a <strong>Ventas / Pedidos</strong> → filtro "Sin monto" y captúralos tú (toca el "—" en Costo o Venta). Al agregar una venta nueva, el botón "✨ Sugerir precio" autocompleta cuando el producto menciona un tamaño estándar.</p>
    </div>` : ''}
  `;
}

/* ============ VENTAS / PEDIDOS ============ */
let ventasFiltro = { texto: '', estado: 'todas', pedido: '' };

function renderVentas() {
  const pedidosUnicos = Array.from(new Set(VENTAS.map((v) => v.pedido))).sort((a, b) => {
    const na = parseInt(a, 10), nb = parseInt(b, 10);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a).localeCompare(String(b));
  });

  let lista = VENTAS.slice();
  if (ventasFiltro.pedido) lista = lista.filter((v) => v.pedido === ventasFiltro.pedido);
  if (ventasFiltro.texto) {
    const q = ventasFiltro.texto.toLowerCase();
    lista = lista.filter((v) => (v.cliente || '').toLowerCase().includes(q) || (v.producto || '').toLowerCase().includes(q));
  }
  if (ventasFiltro.estado === 'pendientes') lista = lista.filter((v) => !v.pagado && !v.regalo && !v.stock);
  else if (ventasFiltro.estado === 'sinmonto') lista = lista.filter((v) => !v.montoConocido && !v.stock);
  else if (ventasFiltro.estado === 'regalo') lista = lista.filter((v) => v.regalo);
  else if (ventasFiltro.estado === 'stock') lista = lista.filter((v) => v.stock);
  else if (ventasFiltro.estado === 'clientes') lista = lista.filter((v) => !v.stock);

  const totalVenta = lista.filter((v) => v.montoConocido).reduce((s, v) => s + (v.venta || 0), 0);
  const totalCosto = lista.filter((v) => v.montoConocido).reduce((s, v) => s + (v.costo || 0), 0);

  const rows = lista.map((v) => {
    const utilidad = (v.montoConocido) ? (v.venta || 0) - (v.costo || 0) : null;
    const estadoBadges = [];
    if (v.stock) estadoBadges.push('<span class="badge muted">Stock</span>');
    else if (v.regalo) estadoBadges.push('<span class="badge muted">Regalo</span>');
    else {
      estadoBadges.push(v.pagado ? '<span class="badge ok">Pagado</span>' : '<span class="badge warn">Sin pagar</span>');
      estadoBadges.push(v.entregado ? '<span class="badge ok">Entregado</span>' : '<span class="badge warn">Pendiente</span>');
    }
    if (v.domicilio) estadoBadges.push('<span class="badge muted">Domicilio</span>');

    return `<tr data-id="${v.id}">
      <td class="mono small">${esc(v.pedido)}</td>
      <td>${esc(v.cliente)}</td>
      <td>${esc(v.producto)}<div class="small">${esc(v.categoria)}</div></td>
      <td class="right">${v.montoConocido ? `<span class="editable" data-edit="costo" data-id="${v.id}">${money(v.costo)}</span>` : `<span class="editable" data-edit="costo" data-id="${v.id}" style="color:var(--warn);">—</span>`}</td>
      <td class="right">${v.montoConocido ? `<span class="editable" data-edit="venta" data-id="${v.id}">${money(v.venta)}</span>` : `<span class="editable" data-edit="venta" data-id="${v.id}" style="color:var(--warn);">—</span>`}</td>
      <td class="right">${utilidad === null ? '—' : money(utilidad)}</td>
      <td>${estadoBadges.join(' ')}</td>
      <td><button class="btn sm ghost" data-editrow="${v.id}">Editar</button> <button class="btn sm danger" data-delrow="${v.id}">✕</button></td>
    </tr>`;
  }).join('');

  return `
    <div class="pagehead">
      <h1 class="serif">Ventas / Pedidos</h1>
      <p>${VENTAS.length} artículos registrados en ${pedidosUnicos.length} pedidos.</p>
    </div>

    <div class="filterbar">
      <input type="text" id="ventasBuscar" placeholder="Buscar cliente o producto..." value="${esc(ventasFiltro.texto)}">
      <select id="ventasPedidoSel">
        <option value="">Todos los pedidos</option>
        ${pedidosUnicos.map((p) => `<option value="${esc(p)}" ${ventasFiltro.pedido === p ? 'selected' : ''}>Pedido ${esc(p)}</option>`).join('')}
      </select>
      <span class="chip ${ventasFiltro.estado === 'todas' ? 'sel' : ''}" data-estado="todas">Todas</span>
      <span class="chip ${ventasFiltro.estado === 'clientes' ? 'sel' : ''}" data-estado="clientes">Solo clientes</span>
      <span class="chip ${ventasFiltro.estado === 'pendientes' ? 'sel' : ''}" data-estado="pendientes">Pendientes de pago</span>
      <span class="chip ${ventasFiltro.estado === 'sinmonto' ? 'sel' : ''}" data-estado="sinmonto">Sin monto</span>
      <span class="chip ${ventasFiltro.estado === 'regalo' ? 'sel' : ''}" data-estado="regalo">Regalos</span>
      <span class="chip ${ventasFiltro.estado === 'stock' ? 'sel' : ''}" data-estado="stock">Stock</span>
      <button class="btn" id="btnNuevaVenta" style="margin-left:auto;">+ Nueva venta</button>
    </div>

    <div class="twrap"><table>
      <thead><tr><th>Pedido</th><th>Cliente</th><th>Producto</th><th class="right">Costo</th><th class="right">Venta</th><th class="right">Utilidad</th><th>Estado</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="8" class="empty">No hay ventas que coincidan con este filtro.</td></tr>'}</tbody>
      <tfoot><tr><td colspan="3" class="foot-total">Totales (con monto capturado)</td><td class="right foot-total">${money(totalCosto)}</td><td class="right foot-total">${money(totalVenta)}</td><td class="right foot-total">${money(totalVenta - totalCosto)}</td><td colspan="2"></td></tr></tfoot>
    </table></div>
  `;
}

function openEditCell(id, field) {
  const v = VENTAS.find((x) => x.id === id);
  if (!v) return;
  const cell = document.querySelector(`[data-edit="${field}"][data-id="${id}"]`);
  if (!cell) return;
  const current = v[field] || '';
  cell.innerHTML = `<input type="number" class="cellinput" value="${current}">`;
  const input = cell.querySelector('input');
  input.focus();
  input.select();
  const commit = async () => {
    const val = parseFloat(input.value);
    if (!isNaN(val)) {
      v[field] = val;
      if (v.costo !== null && v.venta !== null && v.costo !== undefined && v.venta !== undefined) {
        v.montoConocido = true;
      }
      await persist();
    }
    render();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
}

function openVentaModal(id) {
  editingId = id || null;
  const v = id ? VENTAS.find((x) => x.id === id) : null;

  document.getElementById('mvVenta').value = v && v.venta !== null ? v.venta : '';

  document.getElementById('mvEntregado').checked = v ? !!v.entregado : false;
  document.getElementById('mvRegalo').checked = v ? !!v.regalo : false;

async function guardarVenta() {
  const pedido = document.getElementById('mvPedido').value.trim();
  const cliente = document.getElementById('mvCliente').value.trim();
  const producto = document.getElementById('mvProducto').value.trim();
  if (!cliente || !producto) { showToast('Falta cliente o producto.'); return; }
  const costoRaw = document.getElementById('mvCosto').value;
  const ventaRaw = document.getElementById('mvVenta').value;
  const costo = costoRaw === '' ? null : parseFloat(costoRaw);
  const venta = ventaRaw === '' ? null : parseFloat(ventaRaw);

  const data = {
    pedido: pedido || '—',
    cliente,
    producto,
    categoria: document.getElementById('mvCategoria').value,
    costo, venta,
    montoConocido: costo !== null && venta !== null,
    pagado: document.getElementById('mvPagado').checked,
    entregado: document.getElementById('mvEntregado').checked,
    regalo: document.getElementById('mvRegalo').checked,
    stock: document.getElementById('mvStock').checked,
    domicilio: document.getElementById('mvDomicilio').checked,
    notas: document.getElementById('mvNotas').value.trim(),
  };

  if (editingId) {
    const idx = VENTAS.findIndex((x) => x.id === editingId);
    if (idx >= 0) VENTAS[idx] = Object.assign({}, VENTAS[idx], data);
  } else {
    data.id = nextId('v', VENTAS);
    data.origen = 'manual';
    VENTAS.push(data);
  }
  await persist();
  closeModal('modalVenta');
  showToast('Venta guardada.');
  render();
}

/* ============ CLIENTES ============ */
let clienteFiltro = '';

function buildClientesMap() {
  const map = {};
  VENTAS.forEach((v) => {
    if (v.stock || v.cliente === 'Venta general (mostrador)') return;
    const key = v.cliente.trim().toLowerCase();
    if (!map[key]) map[key] = { nombre: v.cliente.trim(), items: [], totalGastado: 0, pendientes: 0, regalos: 0 };
    map[key].items.push(v);
    if (v.montoConocido) map[key].totalGastado += (v.venta || 0);
    if (!v.pagado && !v.regalo) map[key].pendientes++;
    if (v.regalo) map[key].regalos++;
  });
  return map;
}

function renderClientes() {
  const map = buildClientesMap();
  let list = Object.values(map);
  if (clienteFiltro) {
    const q = clienteFiltro.toLowerCase();
    list = list.filter((c) => c.nombre.toLowerCase().includes(q));
  }
  list.sort((a, b) => b.items.length - a.items.length);

  const rows = list.map((c) => `
    <tr>
      <td>${esc(c.nombre)}</td>
      <td class="right">${c.items.length}</td>
      <td class="right">${money(c.totalGastado)}</td>
      <td class="right">${c.pendientes ? `<span class="badge warn">${c.pendientes}</span>` : '—'}</td>
      <td class="right">${c.regalos || '—'}</td>
      <td><button class="btn sm ghost" data-verclient="${esc(c.nombre)}">Ver historial</button></td>
    </tr>`).join('');

  return `
    <div class="pagehead">
      <h1 class="serif">Clientes</h1>
      <p>${Object.keys(map).length} clientes distintos identificados a partir de tus ventas.</p>
    </div>

      <thead><tr><th>Cliente</th><th class="right">Artículos</th><th class="right">Total gastado (conocido)</th><th class="right">Pendientes</th><th class="right">Regalos</th><th></th></tr></thead>

/* ============ FLUJO DE CAJA ============ */
function renderFlujo() {
  const ingresos = VENTAS.filter((v) => v.montoConocido && v.pagado && !v.stock && !v.regalo)
    .map((v) => ({ tipo: 'ingreso', pedido: v.pedido, concepto: `${v.producto} — ${v.cliente}`, monto: v.venta }));
  const ingresosDif = DIFUSORES.filter((d) => d.pagado)
    .map((d) => ({ tipo: 'ingreso', pedido: '—', concepto: `${d.tipo === 'venta' ? 'Venta difusor' : 'Renta difusor'} — ${d.cliente}`, monto: d.monto }));
  const egresos = GASTOS.map((g) => ({ tipo: 'egreso', pedido: g.pedido, concepto: g.concepto, monto: -Math.abs(g.monto) }));

  const movimientos = ingresos.concat(ingresosDif, egresos);
  // orden: por pedido si es numérico, si no al final
  movimientos.sort((a, b) => {
    const na = parseInt(a.pedido, 10), nb = parseInt(b.pedido, 10);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    if (!isNaN(na)) return -1;
    if (!isNaN(nb)) return 1;
    return 0;
  });

  let saldo = 0;
  const rows = movimientos.map((m) => {
    saldo += m.monto;
    return `<tr>
      <td class="mono small">${esc(m.pedido)}</td>
      <td>${esc(m.concepto)}</td>
      <td class="right" style="color:${m.monto >= 0 ? 'var(--ok)' : 'var(--err)'};">${m.monto >= 0 ? '+' : ''}${money(m.monto)}</td>
      <td class="right foot-total">${money(saldo)}</td>
    </tr>`;
  }).join('');

  const totalIngresos = ingresos.concat(ingresosDif).reduce((s, m) => s + m.monto, 0);
  const totalEgresos = egresos.reduce((s, m) => s + m.monto, 0);

  return `
    <div class="pagehead">
      <h1 class="serif">Flujo de Caja</h1>
      <p>Entradas y salidas de dinero, en el orden de tus pedidos.</p>
    </div>
    <div class="kpi-row">
      <div class="kpi"><div class="l">Total entradas</div><div class="n ok">${money(totalIngresos)}</div></div>
      <div class="kpi"><div class="l">Total salidas</div><div class="n err">${money(Math.abs(totalEgresos))}</div></div>
      <div class="kpi"><div class="l">Saldo neto</div><div class="n ${saldo >= 0 ? 'ok' : 'err'}">${money(saldo)}</div></div>
    </div>
    <div class="twrap"><table>
      <thead><tr><th>Pedido</th><th>Concepto</th><th class="right">Movimiento</th><th class="right">Saldo acumulado</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="empty">Sin movimientos aún.</td></tr>'}</tbody>
    </table></div>
    <p class="small" style="margin-top:10px;">Solo se incluyen ventas ya <strong>pagadas</strong> (no pendientes ni regalos) y con monto capturado.</p>
  `;
}

/* ============ EVENT HANDLERS (delegados, se re-adjuntan tras cada render) ============ */
function attachHandlers() {
  // Ventas
  const vb = document.getElementById('ventasBuscar');
  if (vb) vb.addEventListener('input', () => { ventasFiltro.texto = vb.value; render(); });
  const vp = document.getElementById('ventasPedidoSel');
  if (vp) vp.addEventListener('change', () => { ventasFiltro.pedido = vp.value; render(); });
  document.querySelectorAll('[data-estado]').forEach((el) => {
    el.addEventListener('click', () => { ventasFiltro.estado = el.dataset.estado; render(); });
  });
  const bnv = document.getElementById('btnNuevaVenta');
  if (bnv) bnv.addEventListener('click', () => openVentaModal(null));
  document.querySelectorAll('[data-editrow]').forEach((el) => {
    el.addEventListener('click', () => openVentaModal(el.dataset.editrow));
  });
  document.querySelectorAll('[data-delrow]').forEach((el) => {
    el.addEventListener('click', async () => {
      if (!confirm('¿Eliminar esta venta?')) return;
      VENTAS = VENTAS.filter((x) => x.id !== el.dataset.delrow);
      await persist();
      render();
    });
  });
  document.querySelectorAll('[data-edit]').forEach((el) => {
    el.addEventListener('click', () => openEditCell(el.dataset.id, el.dataset.edit));
  });

  // Clientes
  const cb = document.getElementById('clienteBuscar');
  if (cb) cb.addEventListener('input', () => { clienteFiltro = cb.value; render(); });
  document.querySelectorAll('[data-verclient]').forEach((el) => {
    el.addEventListener('click', () => mostrarHistorialCliente(el.dataset.verclient));
  });

  // Gastos
  const bng = document.getElementById('btnNuevoGasto');
  if (bng) bng.addEventListener('click', () => openGastoModal(null));
  document.querySelectorAll('[data-editgasto]').forEach((el) => {
    el.addEventListener('click', () => openGastoModal(el.dataset.editgasto));
  });
  document.querySelectorAll('[data-delgasto]').forEach((el) => {
    el.addEventListener('click', async () => {
      if (!confirm('¿Eliminar este gasto?')) return;
      GASTOS = GASTOS.filter((x) => x.id !== el.dataset.delgasto);
      await persist();
      render();
    });
  });

  // Difusores
  const bnd = document.getElementById('btnNuevoDifusor');
  if (bnd) bnd.addEventListener('click', () => openDifusorModal(null));
  document.querySelectorAll('[data-editdif]').forEach((el) => {
    el.addEventListener('click', () => openDifusorModal(el.dataset.editdif));
  });
  document.querySelectorAll('[data-deldif]').forEach((el) => {
    el.addEventListener('click', async () => {
      if (!confirm('¿Eliminar este registro?')) return;
      DIFUSORES = DIFUSORES.filter((x) => x.id !== el.dataset.deldif);
      await persist();
      render();
    });
  });
}

document.getElementById('mvGuardar').addEventListener('click', guardarVenta);
document.getElementById('mvSugerir').addEventListener('click', () => {
  const producto = document.getElementById('mvProducto').value;
  const s = sugerirPrecio(producto);
  const msg = document.getElementById('mvSugerirMsg');
  if (s) {
    document.getElementById('mvCosto').value = s.costo;
    document.getElementById('mvVenta').value = s.venta;
    msg.textContent = `Aplicado: ${s.label}${s.cantidad > 1 ? ' × ' + s.cantidad : ''}.`;
    msg.style.color = 'var(--ok)';
  } else {
    msg.textContent = 'No reconocí un tamaño estándar (250 ml, 500 ml, 1 litro, 30/60/100 ml) en el nombre del producto — captúralo a mano.';
    msg.style.color = 'var(--warn)';
  }
});
document.getElementById('mgGuardar').addEventListener('click', guardarGasto);
document.getElementById('mdGuardar').addEventListener('click', guardarDifusor);
document.querySelectorAll('.modal-bg').forEach((bg) => {
  bg.addEventListener('click', (e) => { if (e.target === bg) closeModal(bg.id); });
});

/* ============ GATE DE CONTRASEÑA (mismo patrón que /admin.html) ============ */
const GATE_STORAGE_KEY = 'nucleo_control_pw';
let GATE_PASSWORD = sessionStorage.getItem(GATE_STORAGE_KEY) || '';

const gateEl = document.getElementById('gate');
const appShellEl = document.getElementById('appShell');
const gatePasswordEl = document.getElementById('gatePassword');
const gateBtnEl = document.getElementById('gateBtn');
const gateErrEl = document.getElementById('gateErr');

async function initApp() {
  await loadAll();
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('pageContent').style.display = 'block';
  render();
}

async function tryEnter() {
  const pw = gatePasswordEl.value.trim();
  if (!pw) return;
  gateErrEl.textContent = '';
  gateBtnEl.disabled = true;
  gateBtnEl.textContent = 'Entrando…';
  const prevPw = GATE_PASSWORD;
  GATE_PASSWORD = pw;
  try {
    await apiControlTotal('get'); // valida la contraseña contra el servidor
    sessionStorage.setItem(GATE_STORAGE_KEY, pw);
    gateEl.style.display = 'none';
    appShellEl.style.display = 'flex';
    await initApp();
  } catch (err) {
    GATE_PASSWORD = prevPw;
    gateErrEl.textContent = 'Contraseña incorrecta o error de conexión.';
  } finally {
    gateBtnEl.disabled = false;
    gateBtnEl.textContent = 'Entrar';
  }
}
gateBtnEl.addEventListener('click', tryEnter);
gatePasswordEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryEnter(); });

/* Si ya había una contraseña guardada en esta pestaña, entra directo. */
if (GATE_PASSWORD) {
  gatePasswordEl.value = GATE_PASSWORD;
  tryEnter();
}

</script>
